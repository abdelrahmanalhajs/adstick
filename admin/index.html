<!DOCTYPE html>
<html>
<head>
  <!-- Unregister stale service workers immediately -->
  <script>if("serviceWorker"in navigator){navigator.serviceWorker.getRegistrations().then(function(r){for(let s of r)s.unregister();});}</script>

  <base href="/adstick/admin/">

  <!-- Warm up CDN connection before JS even runs -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <!-- Pre-fetch Firebase SDK modules so they're in cache when bootstrap.js runs -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js">

  <!-- Pre-fetch Flutter assets in parallel with Firebase -->
  <link rel="preload" href="main.dart.js?v=927227c8" as="script">
  <link rel="preload" href="canvaskit/canvaskit.js" as="script">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AdStick Admin Portal">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AdStick Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>AdStick Admin</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html,body{margin:0;padding:0;background:#0A0A0F;}
    #_splash{
      position:fixed;inset:0;background:#0A0A0F;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      z-index:9999;transition:opacity .35s ease;
    }
    #_splash.out{opacity:0;pointer-events:none;}
    ._ring{
      width:52px;height:52px;
      border:3px solid rgba(255,107,43,.18);
      border-top-color:#FF6B2B;
      border-radius:50%;
      animation:_spin .75s linear infinite;
    }
    ._name{
      margin-top:18px;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      font-size:20px;font-weight:700;letter-spacing:.6px;
      color:#FF6B2B;
    }
    ._sub{
      margin-top:4px;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      font-size:11px;font-weight:400;letter-spacing:.4px;
      color:#8B8BA0;
    }
    @keyframes _spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
  <div id="_splash">
    <div class="_ring"></div>
    <div class="_name">AdStick</div>
    <div class="_sub">Admin Portal</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('_splash');
      if (!el) return;
      el.classList.add('out');
      setTimeout(function(){ el.remove(); }, 400);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
